apiVersion: 1.0 # must be 1.0
metadata:
  codeName: <filled by init.sh>
  prettyName: # the official, correctly cased name of the provider
  version: v0.0.1
  developer: # developer name, shown to users
  contactEmail: # (optional, recommended) email address for bug reports
  issueTrackerUrl: # (optional, recommended) link to the issue tracker for bug reports
  description: # short description, e.g. to mention limitations
  updateUrl: # (optional) https link to the hosted update.yaml, see https://docs.hedon-haven.top/plugin-hosting-and-updates.md

providerData:
  iconUrl: # https link to a small icon of the website, preferably its favicon, e.g. "https://placehold.co/favicon.ico"
  serviceUrl: # the website the plugin scrapes, shown to users in the app, e.g. "https://example.com"
  handleUrls: # links that the plugin can handle, see https://docs.hedon-haven.top/plugin-yaml.md#handleurls
    - # "https://example.com/home"
    - # "https://example.com/search"
    - # "https://example.com/video"
    - # "https://example.com/author"

initialPageCounts: # first page number of each list, see https://docs.hedon-haven.top/plugin-yaml.md#initialpagecounts
  initialHomePage: # 0
  initialSearchResultsPage: # 0
  initialCommentsPage: # 0
  initialVideoSuggestionsPage: # 0
  initialAuthorVideosPage: # 0