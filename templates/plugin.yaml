apiVersion: 1.0 # do not change
metadata:
  codeName: <filled by init.sh>
  prettyName: # official, correctly cased name of the provider
  version: v0.0.1
  developer: # your developer name to display to user
  contactEmail: # your email for bug reports, optional but recommended.
  issueTrackerUrl: # link to your issue tracker to create a bug report, optional but recommended
  description: # short description of the plugin
  updateUrl: # link to hosted update.yaml. See https://docs.hedon-haven.top/plugin-hosting-and-updates.md

providerData:
  iconUrl: # link to icon shown in the results list, e.g. "https://placehold.co/favicon.ico"
  serviceUrl: # link to the website that this plugin scrapes, e.g. "https://example.com"
  handleUrls: # links that this plugin can handle when they are shared into the app, e.g. see below:
    - # "https://example.com/home"
    - # "https://example.com/search"
    - # "https://example.com/video"
    - # "https://example.com/author"

initialPageCounts: # see https://docs.hedon-haven.top/plugin-page-counts.md
  initialHomePage: # 0
  initialSearchResultsPage: # 0
  initialCommentsPage: # 0
  initialVideoSuggestionsPage: # 0
  initialAuthorVideosPage: # 0